<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujwal Lamsal | Developer Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .card-links {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ujwal's Developer Hub</h1>
    <p>Open-source tools, Cloudflare Workers, and web applications.</p>
  </header>

  <main class="container">
    <div class="grid">
      
      <!-- Card 1: Nepali Date Converter -->
      <div class="card">
        <div>
          <h3>Nepali Date Converter</h3>
          <p>A fast, lightweight tool to convert dates between BS (Bikram Sambat) and AD calendars.</p>
        </div>
        <div class="card-links">
          <a href="https://www.ujwalamsal.com.np/nepali-english-date-converter" target="_blank" class="btn btn-primary">Launch Web Tool</a>
          <a href="https://github.com/princeujwal/nepalidateconverter" target="_blank" class="btn btn-secondary">Source Code</a>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; Ujwal Lamsal. Hosted for free on GitHub Pages.</p>
  </footer>

</body>
</html>
